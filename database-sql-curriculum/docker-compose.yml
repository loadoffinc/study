services:
  db:
    image: postgres:16-alpine
    container_name: study-sql-curriculum-db
    environment:
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study
      POSTGRES_DB: study
    ports:
      - "5432:5432"
    volumes:
      - study_sql_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study -d study"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  study_sql_pgdata:
